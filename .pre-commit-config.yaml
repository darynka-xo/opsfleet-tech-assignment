# Install both hook types once per clone: `pre-commit install` (after
# `pip install -r requirements-dev.txt` into your venv).
# Versions were current as of 2026-11-18; run `pre-commit autoupdate` periodically.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys, --no-ensure-ascii]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.40.0
    hooks:
      - id: typos

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, refactor, test, build, ci, chore, perf, style, revert]

  - repo: local
    hooks:
      # Broken relative links fail the commit (scripts/check_markdown_links.py).
      - id: markdown-links
        name: Check relative Markdown links
        entry: python scripts/check_markdown_links.py
        language: python
        files: \.md$
